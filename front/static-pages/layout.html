<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#eef0f3" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/static-pages/layout.css" />
  </head>
  <body>
    <div class="page">
      <header class="appHeader">
        <a class="appBranding" href="/" aria-label="MinutesMap home">
          <picture>
            <source type="image/avif" srcset="/logo-70.avif 1x, /logo-140.avif 2x" />
            <source type="image/webp" srcset="/logo-70.webp 1x, /logo-140.webp 2x" />
            <img
              src="/logo-70.png"
              srcset="/logo-70.png 1x, /logo-140.png 2x"
              width="70"
              height="70"
              alt="MinutesMap logo"
              class="appLogo"
            />
          </picture>
          <span class="appName">MinutesMap</span>
        </a>
        <div class="appHeaderActions">
          <!--
          <a
            class="appSocialLink"
            href="https://x.com/intent/follow?screen_name=MinutesMap"
            target="_blank"
            rel="noreferrer"
            aria-label="Follow @MinutesMap on X"
            title="Follow @MinutesMap on X"
          >
            Follow on X
          </a>
          -->
          <button
            class="dark-mode-toggle"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
            type="button"
          >
            <div class="toggle-track">
              <span class="toggle-icon sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none" />
                  <path
                    stroke-linecap="round"
                    d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"
                  />
                </svg>
              </span>
              <span class="toggle-icon moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a.7.7 0 0 0-.9-.9 9.9 9.9 0 1 0 12.8 12.8.7.7 0 0 0-.9-.9Z"
                  />
                </svg>
              </span>
              <div class="toggle-thumb light"></div>
            </div>
          </button>
        </div>
      </header>

      <main class="content">
        <article class="card">{{CONTENT}}</article>
      </main>

      <footer class="site-footer">
        <div class="footerContent">
          <div class="footerBranding">
            <a class="footerBrandingLink" href="/" aria-label="MinutesMap home">
              <picture>
                <source type="image/avif" srcset="/logo-70.avif 1x, /logo-140.avif 2x" />
                <source type="image/webp" srcset="/logo-70.webp 1x, /logo-140.webp 2x" />
                <img
                  src="/logo-70.png"
                  srcset="/logo-70.png 1x, /logo-140.png 2x"
                  width="40"
                  height="40"
                  alt="MinutesMap logo"
                  class="footerLogo"
                />
              </picture>
              <span class="footerName">MinutesMap</span>
            </a>
          </div>
          <nav class="footerLinks" aria-label="Footer">
            <ul class="footerLinkList">
              <li><a href="/about">About</a></li>
              <li><a href="/privacy/">Privacy Policy</a></li>
              <li><a href="mailto:minutesmap.viz@gmail.com">Contact</a></li>
              <!--
              <li>
                <a href="https://x.com/MinutesMap" target="_blank" rel="noopener noreferrer">
                  Twitter / X
                </a>
              </li>
              -->
            </ul>
          </nav>
        </div>
      </footer>
    </div>
    <script src="/static-pages/theme-toggle.js" defer></script>
  </body>
</html>
