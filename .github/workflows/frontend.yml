name: 'Frontend Deploy'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'front/**'

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests
        run: npm run test:unit

      - name: Cache Policy Tests
        run: npm run test:cache-policy

      - name: Security Header Tests
        run: npm run test:security-headers

      - name: Unit Coverage Report (Informational)
        run: npm run test:unit:coverage

  test:
    needs: [quality]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        env:
            HOME: /root
            VITE_WS_LOCATION: ${{ vars.VITE_WS_LOCATION }}
        run: npx playwright test -g "@smoke" --project=chromium --reporter=html

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-playwright-report
          path: front/playwright-report/
          retention-days: 7

  deploy:
    needs: [quality, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and Sync to S3
        env:
          HOME: /root
          VITE_WS_LOCATION: ${{ vars.VITE_WS_LOCATION }}
          VITE_PREFIX: ${{ vars.VITE_PREFIX || '' }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npm run build:prod:upload

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E27FQC8AKVWFV6 \
            --paths "/*"
