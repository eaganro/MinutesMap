name: 'Backend & Infra'

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/infra.yml'
      - 'terraform/**'
      - 'functions/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lambda Node dependencies
        working-directory: ./functions
        run: npm ci

      - name: Install Lambda test dependencies
        run: python -m pip install -r functions/requirements-dev.txt

      - name: Run Lambda Node tests
        working-directory: ./functions
        run: npm run test

      - name: Run Lambda tests
        run: python -m pytest functions/tests

      - name: Build Lambda bundles
        working-directory: ./functions
        run: npm run build:lambdas

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap response headers deployment permission
        working-directory: ./terraform
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          policy_arn="arn:aws:iam::${account_id}:policy/GitHubActions-Shard-Compute"
          default_version="$(aws iam get-policy --policy-arn "$policy_arn" --query Policy.DefaultVersionId --output text)"
          aws iam get-policy-version --policy-arn "$policy_arn" --version-id "$default_version" --query PolicyVersion.Document --output json > "$RUNNER_TEMP/current-shard-compute.json"

          if jq -e '[.Statement[].Sid] | (index("CloudFrontResponseHeadersPolicyCreateAndList") != null and index("CloudFrontResponseHeadersPolicyManage") != null)' "$RUNNER_TEMP/current-shard-compute.json" >/dev/null; then
            exit 0
          fi

          jq --arg account_id "$account_id" '.Statement += [
            {
              "Sid": "CloudFrontResponseHeadersPolicyCreateAndList",
              "Effect": "Allow",
              "Action": ["cloudfront:ListResponseHeadersPolicies", "cloudfront:CreateResponseHeadersPolicy"],
              "Resource": "*"
            },
            {
              "Sid": "CloudFrontResponseHeadersPolicyManage",
              "Effect": "Allow",
              "Action": ["cloudfront:UpdateResponseHeadersPolicy", "cloudfront:GetResponseHeadersPolicyConfig", "cloudfront:GetResponseHeadersPolicy", "cloudfront:DeleteResponseHeadersPolicy"],
              "Resource": "arn:aws:cloudfront::\($account_id):response-headers-policy/*"
            }
          ]' "$RUNNER_TEMP/current-shard-compute.json" > "$RUNNER_TEMP/github-shard-compute.json"

          aws iam create-policy-version --policy-arn "$policy_arn" --policy-document "file://$RUNNER_TEMP/github-shard-compute.json" --set-as-default

      - name: Terraform Init & Apply
        working-directory: ./terraform
        env:
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_minutesmap_revalidate_secret: ${{ secrets.MINUTESMAP_REVALIDATE_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve
